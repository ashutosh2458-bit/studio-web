<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Layout Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9e1e7;--panel:#f5f7f8;--ink:#1b2733;--mute:#5b6b7a;--line:#b9c5ce;--cobalt:#2a44e8;--amber:#f0a92e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{padding:20px 24px 4px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding:16px 24px 24px;max-width:1280px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);padding:12px}
#frame{display:block;width:100%;height:600px;margin:0 auto;border:1px solid var(--line);background:#fff;transition:width .2s}
#frame.phone{width:390px;max-width:100%}
.meta{display:flex;justify-content:space-between;gap:8px;padding:10px 2px 0;color:var(--mute);font-size:14px}
.side{display:flex;flex-direction:column;gap:16px}
section{background:var(--panel);border:1px solid var(--line);padding:16px}
h2{margin:0 0 8px;font-size:18px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:9px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:4px}
button:hover{background:var(--ink);color:var(--panel)}
button.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
button.primary:hover{background:#1c33c4}
button[aria-pressed=true]{background:var(--amber);border-color:var(--ink);color:var(--ink)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
#ai{margin:10px 0 0;color:var(--mute);font-size:15px}
pre{margin:10px 0;padding:12px;background:#1b2733;color:#e7edf2;font:13px/1.5 'DM Mono',ui-monospace,monospace;max-height:260px;overflow:auto;white-space:pre}
.saved{max-width:1280px;margin:0 auto;padding:0 24px 32px}
#saved{display:flex;flex-wrap:wrap;gap:8px}
#saved button{padding:8px 12px;border:1px solid var(--line);background:var(--panel);font-weight:400;text-align:left}
#saved button:hover{background:var(--ink)}
.opt{display:block;margin:4px 0 10px;font-size:15px}.opt input{margin-right:8px}
.hint{margin:10px 0 0;color:var(--mute);font-size:14px}
button:disabled{opacity:.4;cursor:not-allowed}button:disabled:hover{background:transparent;color:var(--ink)}
.empty{color:var(--mute);margin:0}
</style>
</head>
<body>
<header><h1>Infinite Layout Studio</h1><p>Every seed is a new website layout. Like what you see and the AI finds more of it.</p></header>
<main>
  <div class="stage">
    <div class="row" style="margin-bottom:10px"><button id="vdesk" aria-pressed="true">Desktop</button><button id="vphone" aria-pressed="false">Phone</button></div>
    <iframe id="frame" title="Layout preview"></iframe>
    <div class="meta"><span id="desc">Loading engine…</span><span id="seed"></span></div></div>
  <div class="side">
    <section><h2>Explore</h2>
      <div class="row">
        <button class="primary" id="like">Like and find similar</button>
        <button id="skip">Skip</button>
        <button id="shuffle">Random layout</button>
      </div>
      <p id="ai"></p></section>
    <section><h2>Get the code</h2>
      <label class="opt"><input type="checkbox" id="usejs"> Add JavaScript (mobile menu, theme toggle, scroll animations)</label>
      <div class="row"><button id="thtml" aria-pressed="true">HTML</button><button id="tcss" aria-pressed="false">CSS</button><button id="tjs" aria-pressed="false" disabled>JavaScript</button></div>
      <pre id="code" tabindex="0"></pre>
      <div class="row"><button id="copy">Copy code</button><button id="dl">Download this tab</button><button id="dlall">Download as separate files</button></div>
      <p class="hint">The HTML tab is one self-contained file. Separate files gives you index.html, style.css and script.js.</p></section>
  </div>
</main>
<div class="saved"><h2>Liked layouts</h2><div id="saved"></div></div>
<script>
var Module = { onRuntimeInitialized: init };
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let seed = 0, kind = 'html', counter = Date.now() % 1e6;
let saved = store.get('lay-saved'), ratings = store.get('lay-ratings');
const call = (name, ret, args) => Module.ccall(name, ret, args.map(() => 'number'), args);
const rand = () => Math.floor(Math.random() * 2147483647);

function init(){
  ratings.forEach(([s, l]) => call('ai_learn', null, [s, l]));
  renderSaved(); show(rand());
}
const useJs = () => $('#usejs').checked ? 1 : 0;
function code(){
  if (kind === 'js') return call('export_js','string',[seed]);
  if (kind === 'css') return call('export_css','string',[seed, useJs()]);
  return call('render_page','string',[seed, useJs(), 0]);
}
function show(s){
  seed = s;
  $('#frame').srcdoc = call('render_page','string',[s, useJs(), 0]);
  $('#desc').textContent = call('describe','string',[s]);
  $('#seed').textContent = 'Seed ' + s;
  $('#ai').textContent = call('ai_report','string',[]);
  $('#code').textContent = code();
}
function rate(liked){
  call('ai_learn', null, [seed, liked]);
  ratings = ratings.concat([[seed, liked]]).slice(-300); store.set('lay-ratings', ratings);
  if (liked && !saved.includes(seed)) { saved.unshift(seed); saved = saved.slice(0, 24); store.set('lay-saved', saved); renderSaved(); }
  show(call('ai_suggest','number',[++counter]));
}
function renderSaved(){
  const box = $('#saved'); box.innerHTML = '';
  if (!saved.length) { box.innerHTML = '<p class="empty">Layouts you like are kept here.</p>'; return; }
  saved.forEach(s => {
    const b = document.createElement('button');
    b.textContent = call('describe','string',[s]);
    b.title = 'Seed ' + s;
    b.onclick = () => { show(s); window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(b);
  });
}
function setKind(k){
  kind = k;
  ['html','css','js'].forEach(n => $('#t'+n).setAttribute('aria-pressed', n === k));
  $('#code').textContent = code();
}
function setView(p){
  $('#frame').classList.toggle('phone', p);
  $('#vdesk').setAttribute('aria-pressed', !p); $('#vphone').setAttribute('aria-pressed', p);
}
$('#like').onclick = () => rate(1);
$('#skip').onclick = () => rate(0);
$('#shuffle').onclick = () => show(rand());
$('#thtml').onclick = () => setKind('html');
$('#tcss').onclick = () => setKind('css');
$('#tjs').onclick = () => setKind('js');
$('#usejs').onchange = () => {
  $('#tjs').disabled = !useJs();
  if (!useJs() && kind === 'js') kind = 'html';
  $('#frame').srcdoc = call('render_page','string',[seed, useJs(), 0]);
  setKind(kind);
};
$('#vdesk').onclick = () => setView(false);
$('#vphone').onclick = () => setView(true);
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#code').textContent); $('#copy').textContent = 'Copied'; }
  catch(e){ $('#copy').textContent = 'Select the code and copy'; }
  setTimeout(() => $('#copy').textContent = 'Copy code', 1500);
};
const save = (name, text, type) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
};
$('#dl').onclick = () => {
  const ext = {html:'html', css:'css', js:'js'}[kind], mime = {html:'text/html', css:'text/css', js:'text/javascript'}[kind];
  save('layout-' + seed + '.' + ext, $('#code').textContent, mime);
};
$('#dlall').onclick = () => {
  save('index.html', call('render_page','string',[seed, useJs(), 1]), 'text/html');
  setTimeout(() => save('style.css', call('export_css','string',[seed, useJs()]), 'text/css'), 300);
  if (useJs()) setTimeout(() => save('script.js', call('export_js','string',[seed]), 'text/javascript'), 600);
};
</script>
<script src="designer.js"></script>
</body>
</html>
